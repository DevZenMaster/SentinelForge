name: SentinelForge CI/CD Quality Gates

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality-gates:
    name: Backend Lint, Typing & Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff Linter Check
        run: ruff check app

      - name: Ruff Code Formatting Check
        run: ruff format --check app

      - name: Mypy Static Type Analysis
        run: mypy app

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: testing
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          SECRET_KEY: test-secret-key-32-characters-minimum-length-req
          NOTIFICATIONS_ENABLED: "true"
          ALLOW_HTTP_WEBHOOKS: "true"
        run: pytest

  database-migrations:
    name: Database Migration Integrity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify Single Migration Head
        run: |
          HEADS=$(alembic heads)
          echo "Current heads: $HEADS"
          COUNT=$(echo "$HEADS" | grep -v '^$' | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 migration head, found $COUNT"
            exit 1
          fi

  frontend-quality-gates:
    name: Frontend Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest Suite
        run: pnpm test

      - name: Next.js ESLint Check
        run: pnpm lint

      - name: TypeScript Typecheck
        run: pnpm typecheck

      - name: Next.js Production Build
        run: pnpm build
